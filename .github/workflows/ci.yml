name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      service_template: ${{ steps.filter.outputs.service_template }}
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            service_template:
              - 'services/_template/**'
              - '.github/workflows/**'
            api_gateway:
              - 'services/api-gateway/**'
              - '.github/workflows/**'
            db:
              - 'services/db/**'
              - '.github/workflows/**'

  service_template:
    name: Service template checks
    needs: changes
    if: needs.changes.outputs.service_template == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/_template
      image_name: mirror-service-template-ci

  api_gateway:
    name: API gateway checks
    needs: changes
    if: needs.changes.outputs.api_gateway == 'true'
    uses: ./.github/workflows/python-service-ci.yml
    with:
      service_path: services/api-gateway
      image_name: mirror-api-gateway-ci

  db:
    name: Database integration checks
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run database container integration test
        run: bash services/db/tests/test_database.sh

  ci_summary:
    name: CI summary
    needs: [changes, service_template, api_gateway, db]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required component checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVICE_TEMPLATE_CHANGED: ${{ needs.changes.outputs.service_template }}
          SERVICE_TEMPLATE_RESULT: ${{ needs.service_template.result }}
          API_GATEWAY_CHANGED: ${{ needs.changes.outputs.api_gateway }}
          API_GATEWAY_RESULT: ${{ needs.api_gateway.result }}
          DB_CHANGED: ${{ needs.changes.outputs.db }}
          DB_RESULT: ${{ needs.db.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changed-component detection did not pass: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$SERVICE_TEMPLATE_CHANGED" = "true" ] && [ "$SERVICE_TEMPLATE_RESULT" != "success" ]; then
            echo "Service template checks did not pass: $SERVICE_TEMPLATE_RESULT"
            exit 1
          fi

          if [ "$API_GATEWAY_CHANGED" = "true" ] && [ "$API_GATEWAY_RESULT" != "success" ]; then
            echo "API gateway checks did not pass: $API_GATEWAY_RESULT"
            exit 1
          fi

          if [ "$DB_CHANGED" = "true" ] && [ "$DB_RESULT" != "success" ]; then
            echo "Database integration checks did not pass: $DB_RESULT"
            exit 1
          fi

          echo "All CI checks required for this pull request passed."
