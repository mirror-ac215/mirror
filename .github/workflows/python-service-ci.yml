name: Python service CI

on:
  workflow_call:
    inputs:
      service_path:
        description: Path to the Python service or job to validate.
        required: true
        type: string
      image_name:
        description: Local Docker image tag used only during the CI build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-lint-build:
    name: ${{ inputs.service_path }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v5.4.0

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v

      - name: Build Docker image
        run: docker build --tag "${{ inputs.image_name }}" .
