[project]
name = "mirror-contract-validation"
version = "0.1.0"
description = "Validation tooling for Mirror shared API and schema contracts"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "openapi-spec-validator>=0.7,<1",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
